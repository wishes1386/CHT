<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中華電信規範違規查詢</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>中華電信規範違規查詢</h1>
          <p>輸入職員行為，查詢是否違反公司規定並取得對應條文</p>
        </div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="query-panel" aria-labelledby="query-title">
      <h2 id="query-title">行為查詢</h2>
      <label class="sr-only" for="behavior-input">描述職員行為</label>
      <textarea id="behavior-input" rows="5" placeholder="例如：某採購主管收受廠商 2 萬元禮物，且未向主管揭露。"></textarea>
      <div class="query-actions">
        <button id="query-button" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.32l4.39 4.39 1.42-1.42-4.39-4.39A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>
          查詢是否違規
        </button>
        <button id="clear-button" type="button" class="ghost-button">清除</button>
      </div>
      <div class="examples" aria-label="範例問題">
        <span class="examples-label">快速範例</span>
        <button type="button" class="example-chip" data-example="某採購主管收受廠商 2 萬元禮物，且未向主管揭露。">收受廠商禮物</button>
        <button type="button" class="example-chip" data-example="某主管的配偶參與公司招標，他沒有向主管或稽核單位揭露。">未揭露關係人招標</button>
        <button type="button" class="example-chip" data-example="某員工把客戶個資檔案外洩給外部廠商。">洩漏客戶個資</button>
        <button type="button" class="example-chip" data-example="某員工知悉公司尚未公布的重大消息，在財報封閉期間買賣公司股票。">封閉期間交易</button>
        <button type="button" class="example-chip" data-example="某主管對提出檢舉的員工進行報復和霸凌。">報復檢舉人</button>
      </div>
    </section>

    <section id="results" class="results" aria-live="polite" hidden>
      <div class="result-summary">
        <div class="summary-icon" id="summary-icon" aria-hidden="true"></div>
        <div>
          <h2 id="summary-title">查詢結果</h2>
          <p id="summary-text"></p>
        </div>
      </div>
      <div id="result-list" class="result-list"></div>
    </section>

    <section class="reference-panel" aria-labelledby="reference-title">
      <h2 id="reference-title">官方政策文件</h2>
      <ul class="document-links">
        <li><a href="https://www.cht.com.tw/home/cht/-/media/web/images/web_2024/esg/chinese/7192_2-2.pdf" target="_blank" rel="noopener">行為準則</a></li>
        <li><a href="https://www.cht.com.tw/home/cht/-/media/web/images/web_2024/esg/chinese/7192_2-5.pdf" target="_blank" rel="noopener">誠信經營守則</a></li>
        <li><a href="https://www.cht.com.tw/home/cht/-/media/web/images/web_2024/esg/chinese/7192_2-4.pdf" target="_blank" rel="noopener">誠信經營作業程序及行為指南</a></li>
        <li><a href="https://www.cht.com.tw/home/cht/-/media/web/images/web_2024/esg/chinese/7192_2-7.pdf" target="_blank" rel="noopener">反貪腐反賄賂與反洗錢政策</a></li>
        <li><a href="https://www.cht.com.tw/home/cht/-/media/web/images/web_2024/esg/chinese/0716.pdf" target="_blank" rel="noopener">防範內線交易管理控制作業要點</a></li>
        <li><a href="https://www.cht.com.tw/zh-TW/home/cht/-/media/Web/Images/ESG2023/4-3new_supplier-code-of-conduct-1.pdf" target="_blank" rel="noopener">供應商行為準則</a></li>
      </ul>
      <p class="disclaimer">本查詢僅依中華電信官網公開文件判斷，正式認定仍以公司調查與正式條文為準。</p>
    </section>
  </main>

  <script src="data/policies.js"></script>
  <script src="app.js"></script>
</body>
</html>
